spring.application.name=login
server.port=${PORT:8080}

# Database Connection (Aiven MySQL in production, localhost fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}

# Mail Configuration (SSL on Port 465 for Cloud Platforms)
# Gmail SMTP Configuration for Render (Port 587 + STARTTLS)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:calorie.tracker.app@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Ensure SSL socket factory is NOT overriding port 587
spring.mail.properties.mail.smtp.ssl.enable=false

# URLs
app.base-url=${APP_BASE_URL:https://calorie-tracker-backend-vgqg.onrender.com}
frontend.url=${FRONTEND_URL:https://calorie-trackerv01.vercel.app}

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

spring.security.oauth2.client.registration.google.client-id=${CLIENT_GOOGLE:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${SECRET_GOOGLE:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${CLIENT_GITHUB:dummy-client-id}
spring.security.oauth2.client.registration.github.client-secret=${SECRET_GITHUB:dummy-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:emails

# Cross-Site Cookie Configuration (Vercel -> Render)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true