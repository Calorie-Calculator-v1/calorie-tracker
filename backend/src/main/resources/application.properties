spring.application.name=login
server.port=${PORT:8080}

# Database Connection (Aiven MySQL in production, localhost fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Mail Configuration (Credentials injected via environment variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:email}
spring.mail.password=${MAIL_PASSWORD:pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URLs
app.base-url=${APP_BASE_URL:http://localhost:8080}
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}